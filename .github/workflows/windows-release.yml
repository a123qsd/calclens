name: Windows executables

on:
  workflow_dispatch:
    inputs:
      include_legacy_ui:
        description: Include the optional Streamlit/Plotly UI in a separate -legacy bundle
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 (${{ matrix.language }}${{ inputs.include_legacy_ui && ' legacy' || '' }})
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        language: [ko, en]
    env:
      PYTHONUTF8: '1'
      PYTHONHASHSEED: '0'
      CALCLENS_INCLUDE_LEGACY_UI: ${{ inputs.include_legacy_ui && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.17'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-legacy.lock
            packaging/windows/*-requirements.lock
      - name: Resolve artifact names from project version
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CALCLENS_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $suffix = if ($env:CALCLENS_INCLUDE_LEGACY_UI -eq '1') { '-legacy' } else { '' }
          "CALCLENS_VARIANT_SUFFIX=$suffix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CALCLENS_NAME=CalcLens-$version-windows-x64-${{ matrix.language }}$suffix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '26.7.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and test offline workspace
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify committed browser assets match their sources
        run: git diff --exit-code -- src/slab_preflight/web_assets frontend/public/THIRD_PARTY_LICENSES.txt
      - name: Install locked runtime and build dependencies
        run: |
          # Full source tests also cover the optional UI; PyInstaller explicitly
          # excludes it from the default workspace executable.
          python -m pip install --require-hashes -r requirements-legacy.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --require-hashes -r packaging/windows/build-requirements.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-deps --no-build-isolation .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
      - name: Test and lint source
        run: |
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m ruff check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Collect bundled licenses and exact ASE source
        run: |
          $legacyFlags = if ($env:CALCLENS_INCLUDE_LEGACY_UI -eq '1') { @('--include-legacy-ui') } else { @() }
          python scripts/collect_windows_licenses.py --output "build/windows/notices$env:CALCLENS_VARIANT_SUFFIX" --source-commit ${{ github.sha }} @legacyFlags
      - name: Build directory bundle
        run: |
          $legacyFlags = if ($env:CALCLENS_INCLUDE_LEGACY_UI -eq '1') { @('--include-legacy-ui') } else { @() }
          python scripts/build_windows.py --language ${{ matrix.language }} --mode onedir --output dist/onedir @legacyFlags
      - name: Install browser test tools
        run: |
          python -m pip install --require-hashes -r packaging/windows/smoke-requirements.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m playwright install chromium
      - name: Exercise directory bundle without external Python in PATH
        run: python scripts/smoke_windows_exe.py --exe "dist/onedir/$env:CALCLENS_NAME/$env:CALCLENS_NAME.exe" --language ${{ matrix.language }} --output build/smoke-onedir
      - name: Package verified directory bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/windows | Out-Null
          Copy-Item "dist/onedir/$env:CALCLENS_NAME.build.json" "dist/windows/$env:CALCLENS_NAME-folder.build.json"
          Compress-Archive -Path "dist/onedir/$env:CALCLENS_NAME" -DestinationPath "dist/windows/$env:CALCLENS_NAME-folder.zip"
      - name: Verify packaged directory archive
        shell: pwsh
        run: |
          $expanded = "build/folder-archive"
          Expand-Archive -Path "dist/windows/$env:CALCLENS_NAME-folder.zip" -DestinationPath $expanded
          $bundle = Join-Path $expanded $env:CALCLENS_NAME
          $executable = Join-Path $bundle "$env:CALCLENS_NAME.exe"
          if (-not (Test-Path $executable -PathType Leaf)) { throw "Folder ZIP is missing its executable." }
          if (-not (Test-Path (Join-Path $bundle "_internal") -PathType Container)) { throw "Folder ZIP is missing _internal." }
          $topLevel = @(Get-ChildItem $expanded)
          if ($topLevel.Count -ne 1 -or $topLevel[0].Name -ne $env:CALCLENS_NAME) { throw "Folder ZIP has unexpected nesting." }
          & $executable --self-test | Set-Content -Path "build/folder-archive-self-test.json" -Encoding utf8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $selfTest = Get-Content "build/folder-archive-self-test.json" -Raw | ConvertFrom-Json
          if ($selfTest.status -ne "ok" -or $selfTest.frozen -ne $true) { throw "Extracted folder ZIP self-test failed." }
      - name: Build final standalone executable
        run: |
          $legacyFlags = if ($env:CALCLENS_INCLUDE_LEGACY_UI -eq '1') { @('--include-legacy-ui') } else { @() }
          python scripts/build_windows.py --language ${{ matrix.language }} --mode onefile --output dist/windows @legacyFlags
      - name: Exercise final executable in isolation
        run: python scripts/smoke_windows_exe.py --exe "dist/windows/$env:CALCLENS_NAME.exe" --language ${{ matrix.language }} --output build/smoke-onefile
      - name: Package exact source and third-party notices
        if: matrix.language == 'ko'
        run: |
          $notices = "build/windows/notices$env:CALCLENS_VARIANT_SUFFIX"
          git archive --format=zip --prefix=calclens-source/ --output="$notices/CalcLens-windows-source$env:CALCLENS_VARIANT_SUFFIX.zip" ${{ github.sha }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item packaging/windows/README.*.md "$notices/"
          Compress-Archive -Path "$notices/*" -DestinationPath "dist/windows/CalcLens-$env:CALCLENS_VERSION-windows-support$env:CALCLENS_VARIANT_SUFFIX.zip"
      - name: Upload verified executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-${{ matrix.language }}${{ inputs.include_legacy_ui && '-legacy' || '' }}
          path: dist/windows/*
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-diagnostics-${{ matrix.language }}${{ inputs.include_legacy_ui && '-legacy' || '' }}
          path: |
            build/smoke-*/
            build/folder-archive-self-test.json
            build/windows/*/stage/
            build/windows/*/pyinstaller/CalcLens/warn-CalcLens.txt
          retention-days: 14
          if-no-files-found: warn
