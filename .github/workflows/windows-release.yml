name: Windows executables

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 (${{ matrix.language }})
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        language: [ko, en]
    env:
      PYTHONUTF8: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.16'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.lock
            packaging/windows/*-requirements.lock
      - name: Install locked runtime and build dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --require-hashes -r packaging/windows/build-requirements.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-deps --no-build-isolation .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
      - name: Test and lint source
        run: |
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m ruff check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Collect bundled licenses and exact ASE source
        run: python scripts/collect_windows_licenses.py --output build/windows/notices --source-commit ${{ github.sha }}
      - name: Build directory bundle
        run: python scripts/build_windows.py --language ${{ matrix.language }} --mode onedir --output dist/onedir
      - name: Install browser test tools
        run: |
          python -m pip install --require-hashes -r packaging/windows/smoke-requirements.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m playwright install chromium
      - name: Exercise directory bundle without external Python in PATH
        run: python scripts/smoke_windows_exe.py --exe dist/onedir/CalcLens-0.3.0-windows-x64-${{ matrix.language }}/CalcLens-0.3.0-windows-x64-${{ matrix.language }}.exe --language ${{ matrix.language }} --output build/smoke-onedir
      - name: Build final standalone executable
        run: python scripts/build_windows.py --language ${{ matrix.language }} --mode onefile --output dist/windows
      - name: Exercise final executable in isolation
        run: python scripts/smoke_windows_exe.py --exe dist/windows/CalcLens-0.3.0-windows-x64-${{ matrix.language }}.exe --language ${{ matrix.language }} --output build/smoke-onefile
      - name: Package exact source and third-party notices
        if: matrix.language == 'ko'
        run: |
          git archive --format=zip --prefix=calclens-source/ --output=build/windows/notices/CalcLens-windows-source.zip ${{ github.sha }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item packaging/windows/README.*.md build/windows/notices/
          Compress-Archive -Path build/windows/notices/* -DestinationPath dist/windows/CalcLens-0.3.0-windows-support.zip
      - name: Upload verified executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-${{ matrix.language }}
          path: dist/windows/*
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-diagnostics-${{ matrix.language }}
          path: |
            build/smoke-*/
            build/windows/*/stage/
            build/windows/*/pyinstaller/CalcLens/warn-CalcLens.txt
          retention-days: 14
          if-no-files-found: warn
