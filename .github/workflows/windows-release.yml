name: Windows executables

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      include_legacy_ui:
        description: Include the optional Streamlit/Plotly UI in a separate -legacy bundle
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  native-folder:
    name: Native extract-once folder and startup timings
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.17'
          architecture: x64
      - name: Install the locked native dependencies
        shell: pwsh
        run: |
          python -m pip install --require-hashes -r requirements.lock -r packaging/desktop/requirements.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $candidates = @("${env:ProgramFiles(x86)}\NSIS\makensis.exe", "$env:ProgramFiles\NSIS\makensis.exe")
          function Find-NsisCompiler {
            $command = Get-Command makensis.exe -ErrorAction SilentlyContinue
            foreach ($candidate in @($candidates + @($command.Source))) {
              if (-not $candidate -or -not (Test-Path $candidate -PathType Leaf)) { continue }
              $directory = Split-Path $candidate
              $roots = @($directory)
              if ((Split-Path $directory -Leaf) -ieq 'Bin') { $roots += Split-Path $directory }
              foreach ($root in $roots) {
                if (Test-Path (Join-Path $root 'Include\FileFunc.nsh') -PathType Leaf) {
                  return [PSCustomObject]@{ Compiler = (Resolve-Path $candidate).Path; Resources = (Resolve-Path $root).Path }
                }
              }
            }
          }
          $installation = Find-NsisCompiler
          if (-not $installation) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $installation = Find-NsisCompiler
          }
          if (-not $installation) { throw 'NSIS compiler with resources was not found after installation' }
          $compiler = $installation.Compiler
          $nsisRoot = $installation.Resources
          if (-not (Test-Path (Join-Path $nsisRoot 'Include\FileFunc.nsh'))) { throw 'NSIS compiler resources are missing' }
          "CALCLENS_NSIS=$compiler" >> $env:GITHUB_ENV
          "NSISDIR=$nsisRoot" >> $env:GITHUB_ENV
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Unexpected application version' }
          "CALCLENS_VERSION=$version" >> $env:GITHUB_ENV
      - name: Test release verification and Windows argument forwarding
        shell: pwsh
        run: |
          python -m pytest -q tests/test_windows_workflow.py tests/test_windows_release_archive.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path build | Out-Null
          $probe = Join-Path $env:GITHUB_WORKSPACE 'build/nsis-probe.nsi'
          $probeExe = Join-Path $env:GITHUB_WORKSPACE 'build/nsis-probe.exe'
          @('Unicode true', ('OutFile "{0}"' -f $probeExe), '!include FileFunc.nsh', 'Section', "System::Call 'kernel32::GetCurrentProcessId() i.r0'", 'SectionEnd') | Set-Content -Encoding utf8 $probe
          & $env:CALCLENS_NSIS '-V2' $probe
          if ($LASTEXITCODE -ne 0) { throw 'NSIS rejected the exact compiler flags used by the builder' }
          if (-not (Test-Path $probeExe -PathType Leaf)) { throw 'NSIS did not produce its probe executable' }
      - name: Build the default native folder ZIP
        shell: pwsh
        run: |
          python scripts/build_portable_windows.py --cache build/native-folder --output "dist/CalcLens-$env:CALCLENS_VERSION-Windows-x64-folder.zip" --makensis "$env:CALCLENS_NSIS"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archive = "dist/CalcLens-$env:CALCLENS_VERSION-Windows-x64-folder.zip"
          $sidecar = "$archive.manifest.json"
          if (-not (Test-Path $archive -PathType Leaf) -or -not (Test-Path $sidecar -PathType Leaf)) { throw 'ZIP or sidecar missing' }
          @($archive, $sidecar) | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant(), (Split-Path $_ -Leaf) } | Set-Content -Encoding utf8 dist/SHA256SUMS.txt
      - name: Extract once and test the shipped launcher
        shell: pwsh
        run: |
          $timer = [System.Diagnostics.Stopwatch]::StartNew()
          python .github/scripts/verify_windows_folder.py --archive "dist/CalcLens-$env:CALCLENS_VERSION-Windows-x64-folder.zip" --manifest "dist/CalcLens-$env:CALCLENS_VERSION-Windows-x64-folder.zip.manifest.json" --checksums dist/SHA256SUMS.txt --version "$env:CALCLENS_VERSION" --destination build/extracted-native --report build/native-folder-integrity.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $timer.Stop()
          @{ verify_and_extract_once_ms = $timer.Elapsed.TotalMilliseconds } | ConvertTo-Json | Set-Content build/unzip-once.json
          $exe = (Resolve-Path "build/extracted-native/CalcLens-$env:CALCLENS_VERSION-Windows-x64/CalcLens.exe").Path
          $report = Join-Path $env:GITHUB_WORKSPACE 'build/native-folder-smoke.json'
          $process = Start-Process -FilePath $exe -ArgumentList ('--language en --native-smoke "{0}"' -f $report) -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Native folder smoke failed" }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if ($result.status -ne 'passed' -or $result.version -ne $env:CALCLENS_VERSION -or $result.platform -ne 'win32' -or $result.architecture -ne 'AMD64' -or $result.native_widget -ne 'MainWindow' -or $result.browser_or_socket_listeners -ne 0) { throw "Native folder report failed" }
          python scripts/benchmark_desktop_startup.py --exe $exe --runs 3 --output build/native-folder-timings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compare pinned 0.9.0 smoke totals on the same runner
        if: env.CALCLENS_VERSION == '0.9.1'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/baseline | Out-Null
          $old = Join-Path $env:GITHUB_WORKSPACE 'build/baseline/CalcLens-0.9.0-Windows-x64.exe'
          Invoke-WebRequest "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/releases/download/v0.9.0/CalcLens-0.9.0-Windows-x64.exe" -OutFile $old
          $pinned = '1eda78e44246084e7919e95956cf8cd641c2a5cc984bd1b4a0061709eed23f97'
          if ((Get-FileHash $old -Algorithm SHA256).Hash.ToLowerInvariant() -cne $pinned) { throw 'Pinned 0.9.0 EXE checksum mismatch' }
          # These totals include native smoke verification and shutdown, unlike readiness milestones.
          python scripts/benchmark_desktop_startup.py --exe $old --legacy-smoke --runs 3 --timeout 120 --output build/smoke-totals-v0.9.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $current = (Resolve-Path "build/extracted-native/CalcLens-$env:CALCLENS_VERSION-Windows-x64/CalcLens.exe").Path
          python scripts/benchmark_desktop_startup.py --exe $current --legacy-smoke --runs 3 --timeout 120 --output build/smoke-totals-current
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Keep the exact default distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-Windows-x64-folder
          path: |
            dist/CalcLens-${{ env.CALCLENS_VERSION }}-Windows-x64-folder.zip
            dist/CalcLens-${{ env.CALCLENS_VERSION }}-Windows-x64-folder.zip.manifest.json
            dist/SHA256SUMS.txt
          compression-level: 0
          if-no-files-found: error
      - name: Keep native readiness measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-Windows-x64-startup-evidence
          path: |
            build/native-folder-smoke.*
            build/native-folder-integrity.json
            build/unzip-once.json
            build/native-folder-timings/
            build/smoke-totals-v0.9.0/
            build/smoke-totals-current/
  test-published-exe:
    name: Run published folder ZIP on Windows x64
    if: github.event_name == 'release' && !contains(github.event.release.tag_name, '-')
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      QT_QPA_PLATFORM: windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.17'
          architecture: x64
      - name: Download and check the exact published folder archive
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(\d+\.\d+\.\d+)$') { throw "Unexpected release tag" }
          $version = $Matches[1]
          $file = "CalcLens-$version-Windows-x64-folder.zip"
          $base = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG"
          Invoke-WebRequest "$base/$file" -OutFile $file
          Invoke-WebRequest "$base/$file.manifest.json" -OutFile "$file.manifest.json"
          Invoke-WebRequest "$base/SHA256SUMS.txt" -OutFile SHA256SUMS.txt
          python .github/scripts/verify_windows_folder.py --archive $file --manifest "$file.manifest.json" --checksums SHA256SUMS.txt --version $version --destination build/published-native --report windows-integrity.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = (Resolve-Path "build/published-native/CalcLens-$version-Windows-x64/CalcLens.exe").Path
          "CALCLENS_EXE=$exe" >> $env:GITHUB_ENV
      - name: Open the native window and exercise the packaged examples
        shell: pwsh
        run: |
          $report = Join-Path $env:GITHUB_WORKSPACE 'windows-smoke.json'
          $arguments = '--language ko --native-smoke "{0}"' -f $report
          $process = Start-Process -FilePath "$env:CALCLENS_EXE" -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "EXE exited with code $($process.ExitCode)" }
          $result = Get-Content windows-smoke.json -Raw | ConvertFrom-Json
          $result | ConvertTo-Json -Depth 6
          if ($result.status -ne 'passed' -or $result.version -ne $env:RELEASE_TAG.Substring(1) -or
              $result.platform -ne 'win32' -or $result.architecture -ne 'AMD64' -or
              $result.native_widget -ne 'MainWindow' -or $result.browser_or_socket_listeners -ne 0) {
            throw "Unexpected Windows desktop smoke result"
          }
      - name: Keep the report and window capture
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-windows-smoke
          path: |
            windows-smoke.*
            windows-integrity.json
          if-no-files-found: warn
  build:
    if: github.event_name == 'workflow_dispatch' && inputs.include_legacy_ui
    name: Optional PyInstaller compatibility (${{ matrix.language }} legacy)
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        language: [ko, en]
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: 'offscreen'
      PYTHONHASHSEED: '0'
      CALCLENS_INCLUDE_LEGACY_UI: ${{ inputs.include_legacy_ui && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.17'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-legacy.lock
            packaging/windows/*-requirements.lock
      - name: Resolve artifact names from project version
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CALCLENS_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $suffix = if ($env:CALCLENS_INCLUDE_LEGACY_UI -eq '1') { '-legacy' } else { '' }
          "CALCLENS_VARIANT_SUFFIX=$suffix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CALCLENS_NAME=CalcLens-$version-windows-x64-${{ matrix.language }}$suffix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '26.7.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and test offline workspace
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify committed browser assets match their sources
        run: git diff --exit-code -- src/slab_preflight/web_assets frontend/public/THIRD_PARTY_LICENSES.txt
      - name: Install locked runtime and build dependencies
        run: |
          # Full source tests also cover the optional UI; PyInstaller explicitly
          # excludes it from the default workspace executable.
          python -m pip install --require-hashes -r requirements-legacy.lock -r packaging/desktop/requirements.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --require-hashes -r packaging/windows/build-requirements.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-deps --no-build-isolation .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
      - name: Test and lint source
        run: |
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m ruff check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Collect bundled licenses and exact ASE source
        run: |
          $legacyFlags = @(if ($env:CALCLENS_INCLUDE_LEGACY_UI -eq '1') { '--include-legacy-ui' })
          python scripts/collect_windows_licenses.py --output "build/windows/notices$env:CALCLENS_VARIANT_SUFFIX" --source-commit ${{ github.sha }} @legacyFlags
      - name: Build directory bundle
        run: |
          $legacyFlags = @(if ($env:CALCLENS_INCLUDE_LEGACY_UI -eq '1') { '--include-legacy-ui' })
          python scripts/build_windows.py --language ${{ matrix.language }} --mode onedir --output dist/onedir @legacyFlags
      - name: Install browser test tools
        run: |
          python -m pip install --require-hashes -r packaging/windows/smoke-requirements.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m playwright install chromium
      - name: Exercise directory bundle without external Python in PATH
        run: python scripts/smoke_windows_exe.py --exe "dist/onedir/$env:CALCLENS_NAME/$env:CALCLENS_NAME.exe" --language ${{ matrix.language }} --output build/smoke-onedir
      - name: Package verified directory bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/windows | Out-Null
          Copy-Item "dist/onedir/$env:CALCLENS_NAME.build.json" "dist/windows/$env:CALCLENS_NAME-folder.build.json"
          Compress-Archive -Path "dist/onedir/$env:CALCLENS_NAME" -DestinationPath "dist/windows/$env:CALCLENS_NAME-folder.zip"
      - name: Verify packaged directory archive
        shell: pwsh
        run: |
          $expanded = "build/folder-archive"
          Expand-Archive -Path "dist/windows/$env:CALCLENS_NAME-folder.zip" -DestinationPath $expanded
          $bundle = Join-Path $expanded $env:CALCLENS_NAME
          $executable = Join-Path $bundle "$env:CALCLENS_NAME.exe"
          if (-not (Test-Path $executable -PathType Leaf)) { throw "Folder ZIP is missing its executable." }
          if (-not (Test-Path (Join-Path $bundle "_internal") -PathType Container)) { throw "Folder ZIP is missing _internal." }
          $topLevel = @(Get-ChildItem $expanded)
          if ($topLevel.Count -ne 1 -or $topLevel[0].Name -ne $env:CALCLENS_NAME) { throw "Folder ZIP has unexpected nesting." }
          & $executable --self-test | Set-Content -Path "build/folder-archive-self-test.json" -Encoding utf8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $selfTest = Get-Content "build/folder-archive-self-test.json" -Raw | ConvertFrom-Json
          if ($selfTest.status -ne "ok" -or $selfTest.frozen -ne $true) { throw "Extracted folder ZIP self-test failed." }
      - name: Build final standalone executable
        run: |
          $legacyFlags = @(if ($env:CALCLENS_INCLUDE_LEGACY_UI -eq '1') { '--include-legacy-ui' })
          python scripts/build_windows.py --language ${{ matrix.language }} --mode onefile --output dist/windows @legacyFlags
      - name: Exercise final executable in isolation
        run: python scripts/smoke_windows_exe.py --exe "dist/windows/$env:CALCLENS_NAME.exe" --language ${{ matrix.language }} --output build/smoke-onefile
      - name: Package exact source and third-party notices
        if: matrix.language == 'ko'
        run: |
          $notices = "build/windows/notices$env:CALCLENS_VARIANT_SUFFIX"
          git archive --format=zip --prefix=calclens-source/ --output="$notices/CalcLens-windows-source$env:CALCLENS_VARIANT_SUFFIX.zip" ${{ github.sha }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item packaging/windows/README.*.md "$notices/"
          Compress-Archive -Path "$notices/*" -DestinationPath "dist/windows/CalcLens-$env:CALCLENS_VERSION-windows-support$env:CALCLENS_VARIANT_SUFFIX.zip"
      - name: Upload verified executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-${{ matrix.language }}${{ inputs.include_legacy_ui && '-legacy' || '' }}
          path: dist/windows/*
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-diagnostics-${{ matrix.language }}${{ inputs.include_legacy_ui && '-legacy' || '' }}
          path: |
            build/smoke-*/
            build/folder-archive-self-test.json
            build/windows/*/stage/
            build/windows/*/pyinstaller/CalcLens/warn-CalcLens.txt
          retention-days: 14
          if-no-files-found: warn
