name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12', '3.13']
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '26.7.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and test offline workspace
        working-directory: frontend
        run: npm ci --ignore-scripts && npm run build && npm test
      - name: Verify committed browser assets match their sources
        run: git diff --exit-code -- src/slab_preflight/web_assets frontend/public/THIRD_PARTY_LICENSES.txt
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation .
      - name: CLI smoke (English JSON and Korean CSV)
        run: |
          calclens examples/graphene.cif --json cli-smoke.json
          calclens examples/graphene.cif --language ko --csv cli-smoke.csv
      - run: python -m pytest -q
      - run: python -m ruff check .
      - run: python scripts/generate_examples.py --check
      - run: python scripts/prepare_public_case.py --check
      - name: Install focused browser test tools
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          python -m pip install --require-hashes -r packaging/windows/smoke-requirements.lock
          python -m playwright install --with-deps chromium
      - name: Check real browser interactions and concurrent tabs
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python scripts/smoke_workspace_regressions.py --output build/workspace-regressions
      - name: Check incremental 3D viewer updates
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python scripts/smoke_viewer_updates.py --samples 1 --output build/viewer-updates
      - name: Check viewer controls, scientific data imports and image export
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python scripts/smoke_viewer_features.py --output build/viewer-features
