name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12', '3.13']
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation .
      - name: CLI smoke (English JSON and Korean CSV)
        run: |
          calclens examples/graphene.cif --json cli-smoke.json
          calclens examples/graphene.cif --language ko --csv cli-smoke.csv
      - run: python -m pytest -q
      - run: python -m ruff check .
      - run: python scripts/generate_examples.py --check
      - run: python scripts/prepare_public_case.py --check
